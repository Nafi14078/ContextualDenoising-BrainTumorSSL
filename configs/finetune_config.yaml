# ─────────────────────────────────────────────
#  Fine-tuning Config  (BraTS-PED → Seg U-Net 2D)
# ─────────────────────────────────────────────

data:
  bratsped_root:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/bratsped-preprocessed/bratsped-preprocessed"
  output_slices:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/bratsped-preprocessed/bratsped-preprocessed"
  modalities:       ["t1n", "t1c", "t2w", "t2f"]
  axis:             2
  slice_skip:       10
  min_tumor_ratio:  0.01
  img_size:         240
  patch_size:       192
  val_split:        0.15
  num_classes:      4

model:
  pretrained_encoder: "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/pretrain_encoder_best.pth"
  in_channels:      4
  out_channels:     4
  base_channels:    48
  feat_ch:          21
  group_norm_groups: 8
  img_size:         192
  feature_size:     48

training:
  phase1_epochs:    30
  phase1_lr:        0.0001
  phase2_epochs:    70
  phase2_lr:        0.00005

  # Cosine warm restarts (for both joint and two-phase)
  cosine_T0:        20         # initial cycle length in epochs
  cosine_Tmult:     2          # cycle length multiplier after each restart

  # Early stopping
  early_stop_patience: 15      # stop if no EMA Dice improvement for N epochs

  batch_size:       8
  weight_decay:     0.00001
  amp:              true
  use_checkpoint:   false
  save_every:       5
  checkpoint_dir:   "/kaggle/working/checkpoints/finetune"
  seed:             42

loss:
  dice_weight:      1.0
  focal_weight:     1.0
  focal_gamma:      2.0
  focal_alpha:      0.25

logging:
  log_every:        50