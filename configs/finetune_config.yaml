# ─────────────────────────────────────────────
#  Fine-tuning Config  (BraTS-PED → Seg U-Net 2D)
#  Single-phase full fine-tuning: no encoder freezing, one LR for everything.
# ─────────────────────────────────────────────

data:
  bratsped_root:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset"
  output_slices:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/bratsped_slices/bratsped_slices"
  modalities:       ["t1n", "t1c", "t2w", "t2f"]
  axis:             2
  slice_skip:       10
  min_tumor_ratio:  0.01
  img_size:         240
  patch_size:       192
  val_split:        0.15
  num_classes:      4

  # ET oversampling: most slices contain little/no ET (your weakest,
  # smallest, most imbalanced region), so this samples ET-positive train
  # slices `et_oversample_factor`x more often than the rest.
  oversample_et:        true
  et_oversample_factor: 5.0

model:
  pretrained_encoder: "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/pretrain_encoder_best.pth"
  encoder_adapt_mode: sum       # "sum" (recommended fix) | "mean" (old, causes ~7x undershoot) | "center"
  in_channels:      4
  out_channels:     4
  base_channels:    48
  feat_ch:          21
  group_norm_groups: 8

training:
  epochs:           100        # replaces phase1_epochs (30) + phase2_epochs (70)
  lr:               0.00005    # single LR for the whole model — replaces phase1_lr/phase2_lr

  # Cosine warm restarts
  cosine_T0:        20         # initial cycle length in epochs
  cosine_Tmult:     2          # cycle length multiplier after each restart

  # Early stopping
  early_stop_patience: 15      # stop if val Dice does not improve for N epochs

  batch_size:       16         # split across GPUs by DataParallel (~8/GPU on 2 GPUs)
  num_workers:      4          # CPU data-loading workers; raise if GPUs sit idle waiting on data
  weight_decay:     0.00001
  amp:              true
  use_checkpoint:   false
  save_every:       5
  checkpoint_dir:   "/kaggle/working/checkpoints/finetune"
  seed:             42

loss:
  dice_weight:      1.0
  focal_weight:     1.0
  focal_gamma:      2.0
  focal_alpha:      0.25

  # Per-class weighting: push the optimizer to prioritize ET (your weakest
  # region) instead of letting it be diluted by the easier NCR/ED classes.
  # dice_class_weights  order: [NCR, ED, ET]      (foreground only)
  # focal_class_weights order: [bg, NCR, ED, ET]  (includes background)
  dice_class_weights:  [1.0, 1.0, 2.0]
  focal_class_weights: [1.0, 1.0, 1.0, 2.0]

logging:
  log_every:        50