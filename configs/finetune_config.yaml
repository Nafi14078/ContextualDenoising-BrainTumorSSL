# ─────────────────────────────────────────────
#  Fine-tuning Config  (BraTS-PED → Seg U-Net 2D)
# ─────────────────────────────────────────────

data:
  bratsped_root:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/bratsped-preprocessed/bratsped-preprocessed"
  output_slices:    "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/bratsped-preprocessed/bratsped-preprocessed"
  modalities:       ["t1n", "t1c", "t2w", "t2f"]
  axis:             2
  slice_skip:       10
  min_tumor_ratio:  0.01
  img_size:         240
  patch_size:       192
  val_split:        0.15
  num_classes:      4            # 0=bg, 1=NCR/NET, 2=ED, 3=ET

model:
  pretrained_encoder: "/kaggle/input/datasets/ashfakazadnafi/bratsped-dataset/pretrain_encoder_best.pth"
  in_channels:      4
  out_channels:     4            # num_classes
  base_channels:    48           # must match pretraining base_ch
  feat_ch:          21           # must match pretraining feat_ch
  group_norm_groups: 8           # must match pretraining gn_groups
  img_size:         192          # patch_size used during training
  feature_size:     48           # kept for backwards compat

training:
  phase1_epochs:    30           # decoder warmup (encoder frozen)
  phase1_lr:        0.0001
  phase2_epochs:    70           # full fine-tuning (all unfrozen)
  phase2_lr:        0.00005

  batch_size:       8
  weight_decay:     0.00001
  amp:              true
  use_checkpoint:   false        # not needed for U-Net (only for Swin)
  save_every:       5
  checkpoint_dir:   "/kaggle/working/checkpoints/finetune"
  seed:             42

loss:
  dice_weight:      1.0
  focal_weight:     1.0
  focal_gamma:      2.0
  focal_alpha:      0.25

logging:
  log_every:        50